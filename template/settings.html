<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALO4OBS</title><meta name="description" content="An OBS overlay that auto-arranges your panels so they never overlap."><meta property="og:title" content="ALO4OBS"><meta property="og:description" content="An OBS overlay that auto-arranges your panels so they never overlap."><link rel="stylesheet" href="preview.css?v=0.9.0-1"><link rel="stylesheet" href="gradient.css?v=0.9.0"><link rel="stylesheet" href="header.css?v=0.9.0-1"></head>
<body>
<script src="version.js?v=0.9.0"></script><script src="gradient.js?v=0.9.0"></script><script src="header.js?v=0.9.0"></script>
<main class="page-layout">
<p id="status" class="sr-only" role="status">샘플 준비 중</p>
<section class="app-section preview-section" aria-labelledby="preview-title"><div class="section-bar"><h2 id="preview-title">미리보기</h2><div class="action-group"><button id="send" class="action-button" type="button"><svg class="button-svg lucide lucide-play" data-lucide="play" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" /></svg><span>샘플 표시</span></button><button id="clear" class="action-button" type="button"><svg class="button-svg lucide lucide-trash-2" data-lucide="trash-2" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></svg><span>샘플 비우기</span></button><button id="fullscreen" class="action-button" type="button"><svg class="button-svg lucide lucide-maximize" data-lucide="maximize" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg><span data-fullscreen-label>전체화면 보기</span></button></div></div>
<div class="preview-body"><div id="preview-fullscreen" class="screen" aria-label="방송 화면 미리보기"><div class="screen-content"><div class="canvas-wrap"><iframe id="preview" title="오버레이 미리보기" src="overlay.html?preview=1"></iframe></div><video id="camera-preview-video" class="camera-preview-video" muted playsinline autoplay aria-hidden="true" hidden></video><div id="panel-hit-areas" aria-label="설정할 패널 선택"></div></div><div class="fullscreen-toolbar" hidden><span class="fullscreen-hint">Esc 키로 종료</span><button id="return-to-settings" type="button">설정으로 돌아가기</button></div></div>
<div class="glass-card sample-card"><h3>샘플 입력</h3><div class="sample-form"><label class="form-field">표시할 패널<select id="event-target"><option value="game">Main</option><option value="custom1">Sub 1</option><option value="custom2">Sub 2</option><option value="custom3">Sub 3</option><option value="chat">Side 1</option><option value="translation">Side 2</option><option value="hand">Side 3</option></select></label><label class="form-field">이름<input id="event-name" value="Viewer"></label><label class="form-field sample-message">내용<textarea id="event-text">Thanks for watching!</textarea></label><p class="editor-help">샘플은 이 미리보기에만 표시됩니다. 웹 위젯과 OBS 소스의 실제 내용은 OBS에서 확인하세요.</p></div></div></div></section>
<section class="app-section settings-section" aria-labelledby="settings-title"><div class="section-bar"><h2 id="settings-title">OBS 설정</h2><div class="action-group"><button id="reset" class="action-button" type="button"><svg class="button-svg lucide lucide-rotate-ccw" data-lucide="rotate-ccw" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg><span>설정 초기화</span></button><button id="bundle" class="action-button" type="button"><svg class="button-svg lucide lucide-save" data-lucide="save" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" /><path d="M7 3v4a1 1 0 0 0 1 1h7" /></svg><span>ZIP 파일로 저장</span></button></div></div>
<form id="settings" class="settings-columns"><section class="glass-card settings-card panel-card"><div class="section-bar"><h3>패널 별 설정</h3><span id="selected-panel-tag" class="panel-number" hidden></span></div><div class="divider"></div><p id="panel-empty" class="empty-hint">변경할 패널을 선택하세요.</p><div id="panel-editor" hidden></div></section><section class="glass-card settings-card placement-card"><h3>패널 위치 &amp; 개수 설정</h3><div class="divider"></div><div id="placement-list" class="placement-list"></div></section><section class="glass-card settings-card global-card"><h3>전역 설정</h3><div class="divider"></div><div id="global-settings"></div></section></form></section>
</main><p id="fullscreen-message" class="fullscreen-message" role="status" hidden></p>
<script src="config.public.js?v=0.9.0"></script><script src="config.js?v=0.9.0" data-optional="local-settings"></script><script src="events.js?v=0.9.0-1"></script><script src="pack.js"></script><script src="camera-preview.js?v=0.9.0"></script><script src="upload-storage.js?v=0.9.0"></script><script src="preview.js?v=0.9.0-1"></script><script src="i18n.js?v=0.9.0"></script>
</body></html>
