name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Work out the release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/version.js | head -1)"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Build distribution ZIP
        run: python build.py
      - name: Check the tag matches the built version
        run: |
          test -f "dist/ALO4OBS-${TAG}.zip" || { echo "dist/ALO4OBS-${TAG}.zip was not built"; ls dist; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $version"; exit 1; }
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          gh release create "$TAG" "dist/ALO4OBS-${TAG}.zip" --title "ALO4OBS ${TAG}" --notes-file notes.md --target "$GITHUB_SHA"
