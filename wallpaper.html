<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OBS Streaming Template · Background</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#canvas{width:1920px;height:1080px;transform-origin:top left;background:#000}img{display:block;width:100%;height:100%;object-fit:cover}</style></head><body><main id="canvas"><img id="image" alt=""></main><script src="config.public.js"></script><script src="gradient.js"></script><script>(()=>{const canvas=document.getElementById('canvas'),image=document.getElementById('image');function apply(config){const style=config.globalStyle?.background;const color=value=>/^#[0-9a-f]{6}$/i.test(value||'')?value:'#000000';canvas.style.backgroundColor=color(style?.color||config.backgroundColor);canvas.style.backgroundImage=style?.mode==='gradient'?KMGGradient.css(style):'none';const value=style&&['file','url'].includes(style.mode)?style.url:config.backgroundImage||'';const src=typeof value==='string'&&(/^(https?:\/\/|blob:|data:image\/(png|jpeg|webp|gif);base64,)/i.test(value)||/^assets\/(?!.*\.\.)[\w./-]+$/i.test(value))?value:'';image.src=src;image.style.display=style&&['solid','gradient'].includes(style.mode)?'none':src?'block':'none';}function scale(){canvas.style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}image.addEventListener('error',()=>{image.style.display='none';});addEventListener('resize',scale);addEventListener('message',event=>{if(event.source===parent&&event.data?.channel==='kmg-preview'&&event.data.action==='apply')apply(event.data.data);});scale();apply(window.OVERLAY_CONFIG);})();</script></body></html>
